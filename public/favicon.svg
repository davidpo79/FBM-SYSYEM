<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0F1117"/>
  <!-- Bright gold border for contrast -->
  <rect x="1" y="1" width="30" height="30" rx="6" stroke="#D4A843" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Bold "F" letter built from rectangles -->
  <!-- Vertical bar -->
  <rect x="9" y="6" width="5.5" height="20" rx="1.2" fill="#D4A843"/>
  <!-- Top horizontal bar -->
  <rect x="9" y="6" width="15" height="5" rx="1.2" fill="#D4A843"/>
  <!-- Middle horizontal bar -->
  <rect x="9" y="13.5" width="11" height="4.5" rx="1.2" fill="#D4A843"/>
</svg>
