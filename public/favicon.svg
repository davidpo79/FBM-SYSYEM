<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#0F1117"/>
  <!-- FBM text - bold gold -->
  <text x="16" y="18" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="11" fill="#D4A843" letter-spacing="0.5">FBM</text>
  <!-- Frequency wave at bottom -->
  <path d="M5 25 Q8 21, 11 25 Q14 29, 16 25 Q18 21, 21 25 Q24 29, 27 25" stroke="#D4A843" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- Signal arcs at top -->
  <path d="M10 9 a6 6 0 0 1 12 0" stroke="#D4A843" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M13 7 a3 3 0 0 1 6 0" stroke="#D4A843" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>
